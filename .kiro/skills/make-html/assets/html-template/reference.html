        }
      }
      const ext = path.split(".").pop().toLowerCase();
      let html;
      if (ext === "md") {
        html = marked.parse(text);
      } else {
        const lang = ext === "sql" ? "sql" : ext === "json" ? "json" : "";
        html = marked.parse("```" + lang + "\n" + text + "\n```");
      }
      content.innerHTML = html;

      // Mermaid: convert fenced mermaid code blocks into .mermaid divs
      content.querySelectorAll("code.language-mermaid").forEach((c) => {
        const pre = c.closest("pre");
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = c.textContent;
        if (pre) pre.replaceWith(div); else c.replaceWith(div);
      });
      // Syntax highlight the rest
      content.querySelectorAll("pre code").forEach((c) => { try { hljs.highlightElement(c); } catch (e) {} });
      // Run mermaid
      if (window.mermaid) {
        try { await window.mermaid.run({ nodes: content.querySelectorAll(".mermaid") }); } catch (e) {}
      }

      // Add ids + build TOC
      const heads = content.querySelectorAll("h2, h3");
      const used = {};
      const tocItems = [];
      heads.forEach((h) => {
        let id = slugify(h.textContent) || "sec";
        if (used[id]) { used[id]++; id = id + "-" + used[id]; } else used[id] = 1;
        h.id = id;
        tocItems.push({ id, text: h.textContent, lvl: h.tagName === "H3" ? 1 : 0 });
      });
      tocNav.innerHTML = tocItems.map((t) => `<a href="#${t.id}" class="${t.lvl ? "pl-6" : ""}" data-anchor>${t.text}</a>`).join("");

      // Intercept internal links to other docs
      content.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href");
        if (/^(https?:)?\/\//.test(href) || href.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; return; }
        if (href.startsWith("#")) return;
        if (/\.(md|sql|json)(#.*)?$/i.test(href)) {
          a.addEventListener("click", (e) => { e.preventDefault(); const rp = resolvePath(path, href.split("#")[0]); location.hash = "#doc=" + rp; });
        }
      });

      // TOC anchor smooth handling
      tocNav.querySelectorAll("[data-anchor]").forEach((a) => a.addEventListener("click", (e) => {
        e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84, behavior: "smooth" });
      }));

      rawLink.href = CONTENT + path;

      // active tree link + reveal its groups
      treeNav.querySelectorAll(".tree-link").forEach((l) => {
        const on = l.getAttribute("data-doc") === path;
        l.classList.toggle("active", on);
        if (on) { let p = l.parentElement; while (p && p !== treeNav) { if (p.tagName === "DETAILS") p.open = true; p = p.parentElement; } l.scrollIntoView({ block: "nearest" }); }
      });

      window.scrollTo({ top: 0, behavior: "auto" });
      // scrollspy for this doc
      initDocScrollspy();
      if (push !== false) history.replaceState(null, "", "#doc=" + path);
      // re-assert language on freshly injected nodes
      document.body.setAttribute("data-lang", document.body.getAttribute("data-lang"));
    }

    let spyObs = null;
    function initDocScrollspy() {
      if (spyObs) spyObs.disconnect();
      const links = Array.from(tocNav.querySelectorAll("a"));
      const map = new Map();
      links.forEach((a) => { const t = document.getElementById(a.getAttribute("href").slice(1)); if (t) map.set(t, a); });
      if (!map.size) return;
      spyObs = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { links.forEach((l) => l.classList.remove("active")); const a = map.get(e.target); if (a) a.classList.add("active"); }
      }), { rootMargin: "-80px 0px -70% 0px" });
      map.forEach((_, t) => spyObs.observe(t));
    }

    // tree link clicks
    treeNav.addEventListener("click", (e) => {
      const link = e.target.closest(".tree-link");
      if (!link) return;
      const doc = link.getAttribute("data-doc");
      location.hash = "#doc=" + doc;
      if (window.innerWidth < 1024) document.getElementById("docTree").classList.remove("open");
    });

    // search filter
    document.getElementById("docSearch").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      treeNav.querySelectorAll(".tree-link").forEach((l) => {
        const match = !q || l.textContent.toLowerCase().includes(q);
        l.style.display = match ? "" : "none";
      });
      // open all groups while searching; keep those with visible children
      treeNav.querySelectorAll("details").forEach((d) => {
        if (q) { const anyVisible = Array.from(d.querySelectorAll(".tree-link")).some((l) => l.style.display !== "none"); d.open = anyVisible; d.style.display = anyVisible ? "" : "none"; }
        else { d.style.display = ""; }
      });
    });

    // routing
    function currentDocFromHash() {
      const m = location.hash.match(/doc=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }
    window.addEventListener("hashchange", () => { const d = currentDocFromHash(); if (d) loadDoc(d); });

    // mobile: repurpose topbar menu button to toggle doc tree (topbar injected by app.js)
    function wireMobile() {
      const btn = document.getElementById("menuBtn");
      const tree = document.getElementById("docTree");
      if (btn && tree) btn.addEventListener("click", (e) => { e.stopPropagation(); tree.classList.toggle("open"); });
      document.addEventListener("click", (e) => { if (window.innerWidth < 1024 && tree && !tree.contains(e.target) && e.target !== btn && (!btn || !btn.contains(e.target))) tree.classList.remove("open"); });
    }

    // init after app.js has built the topbar
    function boot() {
      wireMobile();
      const start = currentDocFromHash() || "bre/00-master-index.md";
      loadDoc(start);
    }
    if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", () => setTimeout(boot, 60));
    else setTimeout(boot, 60);
  })();
  </script>
</body>
</html>
