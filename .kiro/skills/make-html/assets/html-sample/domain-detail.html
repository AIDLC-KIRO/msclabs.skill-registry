<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain Deep-Dive · Dental Dashboard ATX Assessment</title>
  <meta name="description" content="Per-context deep dive for the Dental Dashboard decomposition — responsibilities, owned tables and migration order for each of the five proposed bounded contexts." />
  <script src="assets/js/vendor/tailwindcss-3.4.17.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ["Inter","Noto Sans Thai","ui-sans-serif","system-ui","sans-serif"], mono: ["JetBrains Mono","ui-monospace","monospace"] },
      colors: { brand: {50:"#f2f8fd",100:"#e8f2fd",200:"#c9e2fb",300:"#9ac9ff",400:"#5aa9f7",500:"#0a84ff",600:"#0071e3",700:"#0058b8",800:"#004a9c",900:"#003a7a"}, ink:{950:"#000000"} },
    }}};
  </script>
  <script src="assets/js/vendor/mermaid-10.min.js"></script>
  <script src="assets/js/vendor/marked-12.min.js"></script>
  <link rel="stylesheet" href="assets/css/highlight-github-dark.min.css" />
  <script src="assets/js/vendor/highlight-11.9.0.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230071e3'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial,sans-serif'%3ED%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20" />
</head>
<body data-lang="en">
  <script>try{document.body.dataset.lang=localStorage.getItem("ws-lang")||"en";}catch(e){}</script>
  <aside id="sidebar" class="app-sidebar"></aside>
  <div class="app-main min-h-screen flex flex-col">
    <div id="topbar"></div>

    <main class="flex-1">
      <!-- Domain hero -->
      <section id="domainHero" class="bg-aurora text-white"></section>

      <!-- Domain switcher + facet sub-nav -->
      <div class="sticky top-16 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="max-w-[1180px] mx-auto px-6 lg:px-10">
          <div id="domainPills" class="flex gap-1.5 overflow-x-auto py-2.5 no-scrollbar"></div>
          <div id="facetNav" class="flex gap-1 overflow-x-auto pb-2 -mt-0.5" data-toc></div>
        </div>
      </div>

      <div class="max-w-[1180px] mx-auto px-6 lg:px-10 py-10">
        <div id="domainBody" class="doc space-y-12 min-w-0">
          <div class="doc-loading"><span class="spin"></span> <span class="lang-en">Loading domain…</span><span class="lang-th">กำลังโหลดโดเมน…</span></div>
        </div>
      </div>

      <footer class="border-t border-slate-200 bg-white">
        <div class="max-w-[1180px] mx-auto px-6 lg:px-10 py-8 text-center text-xs text-slate-400">© <span data-year></span> CUSTOMER_NAME · <span class="lang-en">Assembled from AWS/business-rules-extraction source documents</span><span class="lang-th">รวบรวมจากเอกสารต้นฉบับ AWS/business-rules-extraction</span></div>
      </footer>
    </main>
  </div>

  <script src="assets/js/app.js?v=20"></script>
  <!-- Embedded content so the page works over file:// (fetch is blocked there) -->
  <script src="assets/data/docs-data.js?v=1"></script>
  <script>
  (function () {
    // Domain objects driving the deep-dive switcher. Object shape:
    // { slug:String (full slug, matches content dir + #domain= hash), en:String, th:String,
    //   cx:"Large"|"Medium"|"Small" (complexity), t:Number (tables), f:Number (features), r:Number (rules),
    //   c:String (Tailwind color key), db:String (backing databases/context) }
    // Source of truth: business-rules-extraction/domain-decomposition-overview/domain-manifest.json
    const DOMAINS = [
      { slug:"patient-appointment", en:"Patient Appointment", th:"นัดหมายผู้ป่วย",        cx:"Large",  t:4, f:10, r:11, c:"indigo",  db:"PatientAppointment · PatientAppointmentHistory · PatientAppointmentTemp · PatientStatus" },
      { slug:"care-provider",       en:"Care Provider",       th:"ผู้ให้บริการ (แพทย์/ผู้ช่วย)", cx:"Medium", t:4, f:7,  r:8,  c:"emerald", db:"CareProvider · AssistanceDentist · Service · CareProviderService" },
      { slug:"doctor-schedule",     en:"Doctor Schedule",     th:"ตารางเวรแพทย์",         cx:"Medium", t:2, f:5,  r:6,  c:"violet",  db:"DoctorSchedule · DoctorScheduleTemp" },
      { slug:"room-management",     en:"Room Management",     th:"จัดการห้องตรวจ",        cx:"Small",  t:1, f:7,  r:6,  c:"sky",     db:"RoomDetail" },
      { slug:"booking",             en:"Booking",             th:"การจองห้อง",            cx:"Medium", t:2, f:7,  r:8,  c:"amber",   db:"BookingRoom · Workcase" },
    ];
    const FACETS = [
      { id:"overview", en:"Overview", th:"ภาพรวม", f:"overview.md" },
      { id:"features", en:"Features", th:"ฟีเจอร์", f:"features.md" },
      { id:"business-rules", en:"Business Rules", th:"กฎทางธุรกิจ", f:"business-rules.md" },
      { id:"workflows", en:"Workflows", th:"เวิร์กโฟลว์", f:"workflows.md" },
      { id:"validations", en:"Validations", th:"การตรวจสอบ", f:"validations.md" },
      { id:"integrations", en:"Integrations", th:"การเชื่อมต่อ", f:"integrations.md" },
      { id:"component", en:"Component Diagram", th:"ไดอะแกรมองค์ประกอบ", f:"diagrams/component-diagram.md" },
      { id:"sequence", en:"Sequence Diagram", th:"ไดอะแกรมลำดับ", f:"diagrams/sequence-diagram.md" },
      { id:"workflow-diagram", en:"Workflow Diagram", th:"ไดอะแกรมเวิร์กโฟลว์", f:"diagrams/workflow-diagram.md" },
      { id:"service", en:"Target Service Spec", th:"สเปกบริการเป้าหมาย", svc:true },
    ];
    const cxBadge = { Large:"badge-red", Medium:"badge-amber", Small:"badge-green" };
    const cxTh = { Large:"ใหญ่", Medium:"กลาง", Small:"เล็ก" };
    const BRE = "content/bre/detailed-domain-bre/";
    const SVC = "content/bre/domain-decomposition-overview/";

    marked.setOptions({ gfm:true });

    function bil(en, th) { return `<span class="lang-en">${en}</span><span class="lang-th">${th}</span>`; }

    function renderHero(d) {
      document.getElementById("domainHero").innerHTML = `
        <div class="max-w-[1180px] mx-auto px-6 lg:px-10 py-10">
          <a href="domains.html" class="text-sm text-slate-300 hover:text-white inline-flex items-center gap-1 mb-4"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>${bil("All domains","โดเมนทั้งหมด")}</a>
          <div class="flex items-center gap-4 flex-wrap">
            <div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/15 grid place-items-center font-black text-2xl">${d.en.charAt(0)}</div>
            <div>
              <h1 class="text-3xl lg:text-4xl font-black tracking-tight">${bil(d.en, d.th)}</h1>
              <div class="text-slate-300 text-sm mt-1 font-mono">${d.db}</div>
            </div>
            <span class="badge ${cxBadge[d.cx]} ml-auto">${bil(d.cx, cxTh[d.cx])}</span>
          </div>
          <div class="mt-6 flex flex-wrap gap-3">
            <div class="glass rounded-xl px-4 py-2"><span class="text-2xl font-black kpi">${d.t}</span> <span class="text-xs text-slate-300">${bil("Tables","ตาราง")}</span></div>
            <div class="glass rounded-xl px-4 py-2"><span class="text-2xl font-black kpi">${d.f}</span> <span class="text-xs text-slate-300">${bil("Features","ฟีเจอร์")}</span></div>
            <div class="glass rounded-xl px-4 py-2"><span class="text-2xl font-black kpi">${d.r}</span> <span class="text-xs text-slate-300">${bil("Business Rules","กฎทางธุรกิจ")}</span></div>
          </div>
        </div>`;
    }

    function renderPills(active) {
      document.getElementById("domainPills").innerHTML = DOMAINS.map((d) => `
        <a href="#domain=${d.slug}" class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold border transition ${d.slug===active ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-200 hover:border-indigo-300"}">${bil(d.en, d.th)}</a>`).join("");
      document.getElementById("facetNav").innerHTML = FACETS.map((f) => `<a href="#sec-${f.id}" data-facet class="shrink-0 px-2.5 py-1 rounded-md text-xs font-semibold text-slate-500 hover:text-indigo-600 hover:bg-indigo-50">${bil(f.en, f.th)}</a>`).join("");
    }

    // Prefer embedded content (works on file://); fall back to fetch (http).
    function embeddedDoc(url) {
      if (!window.__DOCS__) return undefined;
      const key = url.replace(/^content\//, "");
      return Object.prototype.hasOwnProperty.call(window.__DOCS__, key) ? window.__DOCS__[key] : undefined;
    }
    async function fetchMd(url) {
      const emb = embeddedDoc(url);
      if (emb !== undefined) return emb;
      try { const r = await fetch(url, { cache:"no-cache" }); if (!r.ok) return null; return await r.text(); }
      catch (e) { return null; }
    }

    async function loadDomain(slug) {
      const d = DOMAINS.find((x) => x.slug === slug) || DOMAINS[0];
      renderHero(d);
      renderPills(d.slug);
      const body = document.getElementById("domainBody");
      body.innerHTML = '<div class="doc-loading"><span class="spin"></span> <span class="lang-en">Loading…</span><span class="lang-th">กำลังโหลด…</span></div>';

      const jobs = FACETS.map((fc) => {
        const url = fc.svc ? (SVC + "service-" + d.slug + ".md") : (BRE + "domain-" + d.slug + "/" + fc.f);
        return fetchMd(url).then((txt) => ({ fc, txt }));
      });
      const results = await Promise.all(jobs);

      body.innerHTML = results.map(({ fc, txt }) => {
        const inner = txt ? marked.parse(txt) : `<p class="text-slate-400 text-sm">${fc.svc?'':''}<span class="lang-en">No content.</span><span class="lang-th">ไม่มีเนื้อหา</span></p>`;
        return `<section id="sec-${fc.id}" class="scroll-mt-40">
          <div class="flex items-center gap-2 mb-4">
            <span class="w-1.5 h-5 rounded brand-gradient"></span>
            <span class="text-[0.7rem] font-bold uppercase tracking-wider text-indigo-500">${bil(fc.en, fc.th)}</span>
          </div>
          <div class="card p-6 md-body">${inner}</div>
        </section>`;
      }).join("");

      // mermaid + highlight + linkify
      body.querySelectorAll("code.language-mermaid").forEach((c) => { const pre = c.closest("pre"); const div = document.createElement("div"); div.className = "mermaid"; div.textContent = c.textContent; (pre||c).replaceWith(div); });
      body.querySelectorAll("pre code").forEach((c) => { try { hljs.highlightElement(c); } catch (e) {} });
      if (window.mermaid) { try { await window.mermaid.run({ nodes: body.querySelectorAll(".mermaid") }); } catch (e) {} }

      // facet scrollspy
      initFacetSpy();
      // facet click smooth scroll
      document.querySelectorAll("[data-facet]").forEach((a) => a.addEventListener("click", (e) => {
        e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1));
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 150, behavior:"smooth" });
      }));

      window.scrollTo({ top: 0 });
      document.body.setAttribute("data-lang", document.body.getAttribute("data-lang"));
    }

    let spy;
    function initFacetSpy() {
      if (spy) spy.disconnect();
      const links = Array.from(document.querySelectorAll("[data-facet]"));
      const map = new Map();
      links.forEach((a) => { const t = document.getElementById(a.getAttribute("href").slice(1)); if (t) map.set(t, a); });
      spy = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { links.forEach((l) => l.classList.remove("bg-indigo-50","text-indigo-600")); const a = map.get(e.target); if (a) a.classList.add("bg-indigo-50","text-indigo-600"); }
      }), { rootMargin:"-150px 0px -75% 0px" });
      map.forEach((_, t) => spy.observe(t));
    }

    function currentSlug() { const m = location.hash.match(/domain=([\w-]+)/); return m ? m[1] : null; }
    window.addEventListener("hashchange", () => { const s = currentSlug(); if (s) loadDomain(s); });

    (function boot() {
      loadDomain(currentSlug() || "patient-appointment");
    })();
  })();
  </script>
</body>
</html>
